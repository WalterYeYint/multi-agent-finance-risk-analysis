name: aws-connection-check

# Manual-only — this workflow exists to verify AWS credentials are wired correctly.
# Run from the Actions tab → "aws-connection-check" → "Run workflow".

on:
  workflow_dispatch:

# OIDC: `id-token: write` lets the job mint a token GitHub exchanges for
# short-lived AWS credentials (no static keys). `contents: read` for checkout.
permissions:
  id-token: write
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-2

      - name: sts get-caller-identity
        run: aws sts get-caller-identity
